# Postcode Atlas: static hosting with ~zero CPU per request.
#   - every file is pre-compressed at build time (npm run build -> .br + .gz next to each file),
#     so nginx never compresses on the fly (gzip_static / brotli_static only pick the file)
#   - hashed assets (JS, CSS, data) are cached by browsers for a year: returning visitors
#     only revalidate index.html (a 304 of a few hundred bytes)
#   - no backend, no database, no server-side rendering
#
# Copy dist/postcode-atlas/browser/ to /var/www/postcode-atlas and include this server block.
# brotli_static needs the ngx_brotli module (Debian/Ubuntu: apt install libnginx-mod-http-brotli-static);
# without it remove that line: gzip_static alone still works.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name postcode.example.nl;

    # ssl_certificate     /etc/letsencrypt/live/postcode.example.nl/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/postcode.example.nl/privkey.pem;

    root /var/www/postcode-atlas;
    index index.html;

    access_log off;            # saves disk I/O on a small server; turn on if you want stats
    sendfile on;
    tcp_nopush on;
    open_file_cache max=200 inactive=10m;
    open_file_cache_valid 10m;

    gzip off;                  # never compress at request time...
    gzip_static on;            # ...serve the prebuilt .gz instead
    brotli_static on;          # ...or the prebuilt .br (smaller), if the module is installed
    gzip_vary on;

    types {
        text/html                html;
        text/css                 css;
        text/javascript          js mjs;
        image/svg+xml            svg;
        text/plain               txt;
        application/octet-stream bin;
    }

    # The sha256 is Angular's tiny inline "load the rest of the CSS" script; `npm run build` prints
    # the current value ("CSP script hash"). Update it here if it ever changes.
    set $csp "default-src 'self'; script-src 'self' 'sha256-LMY6wYoFV9I4wWzxaq1N/dTpl4iurQktw706UCHK3vM='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";

    # nginx only inherits add_header into a location that has none of its own, so each location
    # repeats the full set.
    # Content-hashed files never change: cache them for a year. The PC6 files live in a
    # directory named after the hash of all of them (data/pc6-<hash>/<pc4>.bin).
    location ~* "([.-][A-Za-z0-9]{8,}\.(js|css|bin)|/(pc6|adr)-[0-9a-f]{10}/[0-9]{4}\.bin)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy $csp always;
        try_files $uri =404;
    }

    # Everything else (index.html, icon, robots.txt): revalidate (cheap 304 via ETag).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name postcode.example.nl;
    return 301 https://$host$request_uri;
}
